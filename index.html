<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bernardo 4 Anos | Vingadores LEGO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="convite">

        <section class="hero">

            <div class="logo">
                VINGADORES
            </div>

            <p class="chamada">
                UMA NOVA AVENTURA VAI COMEÇAR!
            </p>

            <h1>
                BERNARDO
            </h1>

            <div class="idade">
                4
            </div>

            <h2>
                ANOS
            </h2>

            <p class="mensagem">
                Os Vingadores estão reunindo seus heróis
                para uma missão muito especial!
            </p>

            <button
                class="btn-confirmar"
                onclick="confirmarPresenca()">

                ⚡ CONFIRMAR PRESENÇA

            </button>

        </section>


        <section class="informacoes">

            <div class="info">

                <span>📅</span>

                <div>
                    <strong>DATA</strong>
                    <p>12 de dezembro</p>
                </div>

            </div>


            <div class="info">

                <span>🕐</span>

                <div>
                    <strong>HORÁRIO</strong>
                    <p>12:00</p>
                </div>

            </div>


            <div class="info">

                <span>📍</span>

                <div>
                    <strong>LOCAL</strong>
                    <p>Minha casa</p>
                </div>

            </div>

        </section>


        <section class="contador">

            <h2>
                ⏳ A MISSÃO COMEÇA EM
            </h2>

            <div id="countdown">
                Carregando...
            </div>

        </section>


    </main>

    <script src="script.js"></script>

</body>

</html>
